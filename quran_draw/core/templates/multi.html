<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختبار الأجزاء</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

html, body {
    height: 100%;
    margin: 0;
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    background: #f1f5f9;
    overflow: hidden;
}

/* HEADER */
.header {
    height: 50px;
    background: #111827;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
}

/* FOOTER */
.footer {
    height: 40px;
    background: #111827;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* PAGE */
.page {
    height: calc(100vh - 90px);
    padding: 10px;
}

.container {
    display: flex;
    gap: 15px;
    height: 100%;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

h3, h4 {
    margin: 5px 0;
}

input {
    width: 100%;
    height: 34px;
    margin-bottom: 10px;
    padding: 6px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.small-grid {
    grid-template-columns: repeat(6, 1fr);
}

.box, .level-box {
    height: 40px;
    background: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
    cursor: pointer;
}

.selected, .level-active {
    background: #16a34a;
    color: white;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 5px;
}

button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.submit { background: green; color: white; }
.reset { background: red; color: white; }
.print-btn { background: blue; color: white; }
.pdf-btn { background: purple; color: white; }

#resultSection {
    flex: 1;
    overflow-y: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th, td {
    border: 1px solid #ddd;
    padding: 5px;
    text-align: center;
}

#printable {
    width: 190mm;
    min-height: 277mm;
    padding: 10mm;
    margin: auto; /* 🔥 هذا أهم سطر */
    background: white;
    box-sizing: border-box;
}

@media print {
    body * { visibility: hidden; }
    #printable, #printable * { visibility: visible; }
    #printable { position: absolute; top: 0; width: 210mm; }
}

@media (max-width:768px){
    html, body { overflow:auto; }
    .container { flex-direction:column; }
    .page { height:auto; }
}
@page {
    size: A4;
    margin: 0;
}
</style>
</head>

<body>

<div class="header">
    <span id="headerHijri">📅 ...</span>
    <span id="headerCountdown">⏳ ...</span>
    <span id="headerPrayer">🕌 ...</span>
</div>

<div class="page">
<div class="container">

<!-- الإدخال -->
<div class="card">

<h3>اختبار الأجزاء</h3>

<input type="text" id="name" placeholder="اسم الطالب">

<h4>اختر المستوى</h4>
<div class="grid small-grid" id="levelGrid"></div>

<h4>اختر الأجزاء</h4>
<div class="grid" id="grid"></div>

<div class="buttons">
<button class="reset" onclick="resetSelection()">إعادة</button>
<button class="submit" onclick="submitData()">سحب</button>
</div>

</div>

<!-- النتيجة -->
<div class="card">

<h3>النتيجة</h3>

<div class="buttons">
<button class="print-btn" onclick="printResult()">🖨️ طباعة</button>
<button class="pdf-btn" onclick="downloadPDF()">📄 PDF</button>
</div>

<div id="resultSection">لا يوجد بيانات بعد</div>

</div>

</div>
</div>

<div class="footer">
© نظام سحب الأجزاء
</div>

<script>

/* ===== متغيرات ===== */
let selected = [];
let selectedLevel = null;
let lastResult = null;

/* ===== LEVELS ===== */
[5,10,15,20,25,30].forEach(l=>{
    let div = document.createElement("div");
    div.className = "level-box";
    div.innerText = l;

    div.onclick = ()=>{
        selectedLevel = l;

        document.querySelectorAll(".level-box").forEach(b=>b.classList.remove("level-active"));
        div.classList.add("level-active");

        // reset parts
        selected = [];
        document.querySelectorAll(".box").forEach(b=>b.classList.remove("selected"));

        // auto select all
        if(l === 30){
            selected = Array.from({length:30},(_,i)=>i+1);
            document.querySelectorAll(".box").forEach(b=>b.classList.add("selected"));
        }
    };

    levelGrid.appendChild(div);
});

/* ===== PARTS ===== */
for(let i=1;i<=30;i++){
    let div = document.createElement("div");
    div.className = "box";
    div.innerText = i;

    div.onclick = ()=>{
        if(!selectedLevel){
            Swal.fire('تنبيه','اختر المستوى أولاً','warning');
            return;
        }

        if(selectedLevel === 30) return;

        if(selected.includes(i)){
            selected = selected.filter(x=>x!==i);
            div.classList.remove("selected");
        }else{
            if(selected.length >= selectedLevel){
                Swal.fire('تنبيه','الحد '+selectedLevel,'info');
                return;
            }
            selected.push(i);
            div.classList.add("selected");
        }
    };

    grid.appendChild(div);
}

/* ===== RESET ===== */
function resetSelection(){
    selected = [];
    selectedLevel = null;
    lastResult = null;

    document.getElementById("name").value="";
    document.getElementById("resultSection").innerHTML="لا يوجد بيانات بعد";

    document.querySelectorAll(".box").forEach(b=>b.classList.remove("selected"));
    document.querySelectorAll(".level-box").forEach(b=>b.classList.remove("level-active"));
}

/* ===== SUBMIT ===== */
function submitData(){

    let name = document.getElementById("name").value;

    if(!name || !selectedLevel){
        Swal.fire('خطأ','أكمل البيانات','error');
        return;
    }

    if(selected.length !== selectedLevel){
        Swal.fire('تنبيه','يجب اختيار '+selectedLevel,'warning');
        return;
    }

    fetch('/draw/',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            name:name,
            level:selectedLevel,
            parts:selected
        })
    })
    .then(res=>res.json())
    .then(data=>{

        lastResult = data;

        let html = `
        <div id="printable">
        <h2 style="text-align:center;">نموذج اختبار</h2>
        <hr>
        <p><b>الاسم:</b> ${name}</p>
        <p><b>الأجزاء المختارة:</b> ${selected.join(", ")}</p>
        <p><b>العشوائية:</b> ${data.chosen_parts.join(", ")}</p>

        <table>
        <tr><th>الجزء</th><th>السورة</th><th>الصفحة</th></tr>
        `;

        data.results.forEach(r=>{
            html+=`
            <tr>
                <td>${r.juz}</td>
                <td>${r.surah}</td>
                <td>${r.page}</td>
            </tr>`;
        });

        html += "</table></div>";

        document.getElementById("resultSection").innerHTML = html;
    });
}

/* ===== PRINT ===== */
function printResult(){
    if(!lastResult){
        Swal.fire('تنبيه','قم بالسحب أولاً','warning');
        return;
    }
    window.print();
}

/* ===== PDF ===== */
function downloadPDF(){

    if(!lastResult){
        Swal.fire('تنبيه','قم بالسحب أولاً','warning');
        return;
    }

    const element = document.getElementById("printable");

    const opt = {
        margin:       0,
        filename:     'exam.pdf',
        image:        { type: 'jpeg', quality: 1 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
}
/* ===== الصلاة ===== */
async function loadPrayerTimes(){

    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Amman&country=Jordan");
    const data = await res.json();

    const t = data.data.timings;
    const hijriRaw = data.data.date.hijri;

    const months = {
        "1":"محرم","2":"صفر","3":"ربيع الأول","4":"ربيع الآخر",
        "5":"جمادى الأولى","6":"جمادى الآخرة","7":"رجب",
        "8":"شعبان","9":"رمضان","10":"شوال",
        "11":"ذو القعدة","12":"ذو الحجة"
    };

    document.getElementById("headerHijri").innerText =
        hijriRaw.day + " " + months[hijriRaw.month.number] + " " + hijriRaw.year;

    const prayers = {
        "الفجر": t.Fajr,
        "الظهر": t.Dhuhr,
        "العصر": t.Asr,
        "المغرب": t.Maghrib,
        "العشاء": t.Isha
    };

    let now = new Date();
    let next=null, nextName="";

    for (let name in prayers) {
        let [h,m]=prayers[name].split(":");
        let time=new Date();
        time.setHours(h,m,0);

        if(time>now){
            next=time;
            nextName=name;
            break;
        }
    }

    document.getElementById("headerPrayer").innerText = nextName;

    setInterval(()=>{
        let diff = next - new Date();
        let h = Math.floor(diff/(1000*60*60));
        let m = Math.floor((diff/(1000*60))%60);

        document.getElementById("headerCountdown").innerText =
            nextName + " - " + h + "س " + m + "د";
    },1000);
}

loadPrayerTimes();

</script>

</body>
</html>
